<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="is-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="40%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <radialGradient id="gargantua" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="35%" stop-color="#050a14"/>
      <stop offset="42%" stop-color="#ffbe53"/>
      <stop offset="50%" stop-color="#ff7b00" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#is-bg)"/>
  <circle cx="200" cy="240" r="180" fill="url(#gargantua)"/>

  <!-- Netflix Badge -->
  <g transform="translate(24, 28)">
    <path d="M0,0 L7,0 L18,32 L18,0 L24,0 L24,36 L17,36 L6,4 L6,36 L0,36 Z" fill="#E50914"/>
    <text x="32" y="22" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="3">FILM</text>
  </g>
  <rect x="310" y="28" width="66" height="20" rx="3" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="343" y="42" fill="#FFF" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">IMAX 4K</text>

  <!-- Black Hole Accretion Disk Horizon -->
  <ellipse cx="200" cy="240" rx="140" ry="25" fill="none" stroke="#ffbe53" stroke-width="4" opacity="0.9"/>
  <ellipse cx="200" cy="240" rx="160" ry="8" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>

  <!-- Title: INTERSTELLAR -->
  <g transform="translate(200, 420)" text-anchor="middle">
    <text y="0" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="8">INTERSTELLAR</text>
    <text y="28" fill="#60A5FA" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="5">MANKIND WAS NOT MEANT TO DIE HERE</text>
  </g>

  <!-- Bottom info -->
  <g transform="translate(200, 545)" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">
    <text y="0" fill="#46D369" font-size="13" font-weight="700">99% Match  ·  2014  ·  PG-13  ·  2h 49m</text>
    <text y="22" fill="#93C5FD" font-size="11" font-weight="500">Christopher Nolan  ·  Sci-Fi  ·  Space  ·  Epic</text>
  </g>
</svg>
